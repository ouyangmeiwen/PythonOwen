[project]
name = "LMS-Installer"
version = "0.3.4"
description = "LMS deployment tool for Linux"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dmpython>=2.5.8",
    "prompt-toolkit>=3.0.50",
    "psycopg2-binary>=2.9.10",
    "pymysql>=1.1.1",
    "python-dotenv>=1.0.1",
    "toml>=0.10.2",
]

[dependency-groups]
dev = ["pyinstaller>=6.12.0", "ruff>=0.11.2"]
